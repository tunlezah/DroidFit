# Gradle / JVM
# 4g heap keeps KSP + Room + Hilt annotation processing comfortable on the
# 7 GB GitHub Actions runners. Do not raise past 5g: the runner will OOM-kill.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Keep the build honest: warn loudly about API/compat drift rather than silently
# picking defaults that differ between local machines and CI.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
