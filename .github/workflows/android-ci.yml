name: Android CI

# Produces a sideloadable APK on every push and pull request.
#
# WHICH VARIANT AND WHY (ADR-0002, ADR-0012):
# The published artefact is the **release** variant, which this project configures to
# use the *debug signing config*. That combination is deliberate:
#   - debug-signed  -> no keystore, no secrets, installs on any device with
#                      "install unknown apps" enabled
#   - release build -> R8 minification and resource shrinking, which measured
#                      2.38 MB against 32.58 MB for the unminified debug variant
# The debug variant is still compiled and unit-tested; it is just not what gets
# handed to a phone. To move to real release signing later, see
# /framework/14_ci_cd_and_release.md §Switching to a release keystore.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches gradle.properties. Set here too so a runner with a different default
  # cannot silently change the memory profile.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to the shared cache from the default branch, so a PR cannot
          # poison the cache other builds read.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Static analysis (detekt, incl. ktlint formatting rules)
        run: ./gradlew detekt --continue

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble the sideload APK (release variant, debug-signed)
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK is installable
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$APK")
          echo "Built $APK ($(numfmt --to=iec "$SIZE_BYTES"))"
          # A zero-length or truncated file would still satisfy `find`; check the
          # archive really contains a manifest and dex.
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          # Size guard. The minified APK measured 2.38 MB at the time this was
          # written. A sudden jump to tens of megabytes means an icon or asset
          # library crept back in (see VisceralFitIcons) or minification silently
          # stopped applying — both have happened, so this is a real check, not
          # ceremony. Raise the ceiling deliberately, with a decisions.md entry.
          MAX_BYTES=$((12 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::APK is $SIZE_BYTES bytes, over the $MAX_BYTES ceiling."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visceralfit-sideload-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14

  # Instrumentation tests need an emulator, which is slow and flaky on shared
  # runners. They run on the default branch and on demand rather than on every
  # push, so a red emulator never blocks an unrelated PR. See
  # /framework/13_testing_strategy.md §What runs where.
  instrumentation:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 is what the Motorola Edge 60 ships with, so the emulator matches
          # the target device rather than the newest available image.
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore
          retention-days: 14
