# VisceralFit detekt configuration.
# `buildUponDefaultConfig = true` is set in the root build file, so this file only
# records deliberate deviations. Every deviation needs a one-line reason.

build:
  maxIssues: 0

formatting:
  active: true
  android: true
  autoCorrect: false
  # Compose @Composable functions are PascalCase by convention; ktlint's naming
  # rule would flag every one of them.
  FunctionNaming:
    active: false
  # Compose builders legitimately produce long argument lists.
  MaximumLineLength:
    active: true
    maxLineLength: 120

complexity:
  LongParameterList:
    active: true
    # Compose state hoisting means screen composables take many lambdas.
    functionThreshold: 9
    constructorThreshold: 9
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    active: true
    ignoreAnnotatedFunctions: ['Composable']
    thresholdInFiles: 20
    thresholdInClasses: 20
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated: ['Composable', 'Preview']

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # Vector artwork is coordinates. In `illustration/` and `icon/` the numbers *are*
    # the content: a figure drawn in the 100x100 logical box (see
    # framework/11_illustration_spec.md) is a list of points, and naming each one
    # (`LEFT_KNEE_X = 62f`) would be less readable than the coordinate itself, not more.
    # This is the only place in the codebase where a bare number carries no hidden
    # meaning. Do NOT widen this exclusion to any other package.
    # NOTE: specifying `excludes` REPLACES detekt's defaults rather than adding to them,
    # so the test-source entries below must be restated. Dropping them makes every
    # expected value in a test ("assertEquals(360, …)") a violation.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/core/designsystem/illustration/**'
      - '**/core/designsystem/icon/**'
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  # Explicit `return@` labels in coroutine builders read better than the
  # alternative; the rule fights the codebase more than it helps.
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']

exceptions:
  TooGenericExceptionCaught:
    active: true
    # Android TTS and MediaPlayer both surface failures as bare Exception.
    excludes: ['**/speech/**']
